<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the main board -->
    <linearGradient id="boardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for pins -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for notice papers -->
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#E8F5E8" stroke="#4CAF50" stroke-width="8"/>
  
  <!-- Main notice board -->
  <rect x="120" y="140" width="272" height="232" rx="16" ry="16" 
        fill="url(#boardGradient)" 
        filter="url(#shadow)"
        transform="rotate(-2 256 256)"/>
  
  <!-- Board frame -->
  <rect x="120" y="140" width="272" height="232" rx="16" ry="16" 
        fill="none" stroke="#1B5E20" stroke-width="4"/>
  
  <!-- Notice papers -->
  <!-- Paper 1 -->
  <rect x="140" y="160" width="120" height="80" rx="4" ry="4" 
        fill="url(#paperGradient)" 
        filter="url(#shadow)"
        transform="rotate(-1 200 200)"/>
  
  <!-- Paper 2 -->
  <rect x="280" y="180" width="100" height="60" rx="4" ry="4" 
        fill="url(#paperGradient)" 
        filter="url(#shadow)"
        transform="rotate(1 330 210)"/>
  
  <!-- Paper 3 -->
  <rect x="160" y="260" width="140" height="70" rx="4" ry="4" 
        fill="url(#paperGradient)" 
        filter="url(#shadow)"
        transform="rotate(-0.5 230 295)"/>
  
  <!-- Paper 4 -->
  <rect x="320" y="280" width="80" height="50" rx="4" ry="4" 
        fill="url(#paperGradient)" 
        filter="url(#shadow)"
        transform="rotate(0.5 360 305)"/>
  
  <!-- Pins -->
  <!-- Pin 1 -->
  <circle cx="200" cy="180" r="8" fill="url(#pinGradient)"/>
  <circle cx="200" cy="180" r="4" fill="#FFAB91"/>
  
  <!-- Pin 2 -->
  <circle cx="330" cy="200" r="8" fill="url(#pinGradient)"/>
  <circle cx="330" cy="200" r="4" fill="#FFAB91"/>
  
  <!-- Pin 3 -->
  <circle cx="230" cy="280" r="8" fill="url(#pinGradient)"/>
  <circle cx="230" cy="280" r="4" fill="#FFAB91"/>
  
  <!-- Pin 4 -->
  <circle cx="360" cy="300" r="8" fill="url(#pinGradient)"/>
  <circle cx="360" cy="300" r="4" fill="#FFAB91"/>
  
  <!-- Text lines on papers -->
  <!-- Paper 1 lines -->
  <line x1="150" y1="180" x2="250" y2="180" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="150" y1="190" x2="240" y2="190" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="150" y1="200" x2="220" y2="200" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Paper 2 lines -->
  <line x1="290" y1="200" x2="370" y2="200" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="290" y1="210" x2="360" y2="210" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Paper 3 lines -->
  <line x1="170" y1="280" x2="300" y2="280" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="170" y1="290" x2="280" y2="290" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="170" y1="300" x2="250" y2="300" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Paper 4 lines -->
  <line x1="330" y1="300" x2="390" y2="300" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="330" y1="310" x2="380" y2="310" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- App name text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="32" font-weight="bold" 
        text-anchor="middle" fill="#2E7D32">NoticeBoard</text>
  
  <!-- Subtitle -->
  <text x="256" y="450" font-family="Arial, sans-serif" font-size="16" 
        text-anchor="middle" fill="#4CAF50">Digital Notice Board</text>
</svg>

