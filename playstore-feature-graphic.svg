<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the main board -->
    <linearGradient id="boardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for pins -->
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for notice papers -->
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="6" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGradient)"/>
  
  <!-- Main notice board (left side) -->
  <rect x="100" y="100" width="300" height="300" rx="20" ry="20" 
        fill="url(#boardGradient)" 
        filter="url(#shadow)"
        transform="rotate(-3 250 250)"/>
  
  <!-- Board frame -->
  <rect x="100" y="100" width="300" height="300" rx="20" ry="20" 
        fill="none" stroke="#1B5E20" stroke-width="6"
        transform="rotate(-3 250 250)"/>
  
  <!-- Notice papers -->
  <!-- Paper 1 -->
  <rect x="130" y="130" width="120" height="80" rx="6" ry="6" 
        fill="url(#paperGradient)" 
        filter="url(#shadow)"
        transform="rotate(-1 190 170)"/>
  
  <!-- Paper 2 -->
  <rect x="280" y="150" width="100" height="60" rx="6" ry="6" 
        fill="url(#paperGradient)" 
        filter="url(#shadow)"
        transform="rotate(1 330 180)"/>
  
  <!-- Paper 3 -->
  <rect x="150" y="250" width="140" height="70" rx="6" ry="6" 
        fill="url(#paperGradient)" 
        filter="url(#shadow)"
        transform="rotate(-0.5 220 285)"/>
  
  <!-- Paper 4 -->
  <rect x="320" y="280" width="80" height="50" rx="6" ry="6" 
        fill="url(#paperGradient)" 
        filter="url(#shadow)"
        transform="rotate(0.5 360 305)"/>
  
  <!-- Pins -->
  <!-- Pin 1 -->
  <circle cx="190" cy="150" r="10" fill="url(#pinGradient)"/>
  <circle cx="190" cy="150" r="5" fill="#FFAB91"/>
  
  <!-- Pin 2 -->
  <circle cx="330" cy="170" r="10" fill="url(#pinGradient)"/>
  <circle cx="330" cy="170" r="5" fill="#FFAB91"/>
  
  <!-- Pin 3 -->
  <circle cx="220" cy="270" r="10" fill="url(#pinGradient)"/>
  <circle cx="220" cy="270" r="5" fill="#FFAB91"/>
  
  <!-- Pin 4 -->
  <circle cx="360" cy="300" r="10" fill="url(#pinGradient)"/>
  <circle cx="360" cy="300" r="5" fill="#FFAB91"/>
  
  <!-- Text lines on papers -->
  <!-- Paper 1 lines -->
  <line x1="140" y1="150" x2="250" y2="150" stroke="#E0E0E0" stroke-width="3"/>
  <line x1="140" y1="160" x2="240" y2="160" stroke="#E0E0E0" stroke-width="3"/>
  <line x1="140" y1="170" x2="220" y2="170" stroke="#E0E0E0" stroke-width="3"/>
  
  <!-- Paper 2 lines -->
  <line x1="290" y1="170" x2="370" y2="170" stroke="#E0E0E0" stroke-width="3"/>
  <line x1="290" y1="180" x2="360" y2="180" stroke="#E0E0E0" stroke-width="3"/>
  
  <!-- Paper 3 lines -->
  <line x1="160" y1="270" x2="290" y2="270" stroke="#E0E0E0" stroke-width="3"/>
  <line x1="160" y1="280" x2="280" y2="280" stroke="#E0E0E0" stroke-width="3"/>
  <line x1="160" y1="290" x2="250" y2="290" stroke="#E0E0E0" stroke-width="3"/>
  
  <!-- Paper 4 lines -->
  <line x1="330" y1="300" x2="390" y2="300" stroke="#E0E0E0" stroke-width="3"/>
  <line x1="330" y1="310" x2="380" y2="310" stroke="#E0E0E0" stroke-width="3"/>
  
  <!-- App name and description (right side) -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        text-anchor="start" fill="#2E7D32">NoticeBoard</text>
  
  <!-- Subtitle -->
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="28" 
        text-anchor="start" fill="#4CAF50">Digital Notice Board</text>
  
  <!-- Description -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="20" 
        text-anchor="start" fill="#666666">For Educational Institutes</text>
  
  <!-- Features -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="18" 
        text-anchor="start" fill="#4CAF50">✓ QR Code Subscription</text>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="18" 
        text-anchor="start" fill="#4CAF50">✓ Real-time Notices</text>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="18" 
        text-anchor="start" fill="#4CAF50">✓ Easy Management</text>
  
</svg>

